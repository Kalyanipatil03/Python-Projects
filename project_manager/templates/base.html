<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexusPM - Project Lifecycle Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans selection:bg-cyan-500 selection:text-black">

    <nav class="bg-slate-900/80 backdrop-blur-md border-b border-slate-800 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
            <a href="/" class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-cyan-500 via-indigo-500 to-fuchsia-500 text-white flex items-center justify-center font-black text-lg shadow-lg shadow-cyan-500/20">
                    PM
                </div>
                <div>
                    <span class="text-xl font-bold bg-gradient-to-r from-cyan-400 via-indigo-300 to-fuchsia-400 bg-clip-text text-transparent">NexusPM</span>
                    <span class="block text-[10px] text-slate-400 font-mono tracking-wider uppercase">Project Manager</span>
                </div>
            </a>
            
            <div class="flex items-center gap-4">
                {% if current_user.is_authenticated %}
                    <a href="/" class="text-xs font-semibold text-slate-300 hover:text-cyan-400 transition">Workspaces</a>
                    <span class="text-xs px-3 py-1 rounded-full bg-slate-800 border border-slate-700 text-cyan-300 font-mono">
                        👤 {{ current_user.username }}
                    </span>
                    <a href="/logout" class="bg-rose-500/10 text-rose-400 border border-rose-500/20 hover:bg-rose-500 hover:text-white px-3.5 py-1.5 rounded-xl text-xs font-semibold transition">Logout</a>
                {% else %}
                    <a href="/login" class="text-slate-300 hover:text-white text-xs font-semibold transition">Login</a>
                    <a href="/register" class="bg-gradient-to-r from-cyan-500 to-indigo-600 hover:opacity-90 text-white px-4 py-1.5 rounded-xl text-xs font-semibold transition shadow-lg shadow-cyan-500/20">Register</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto p-6">
        {% block content %}{% endblock %}
    </main>

</body>
</html>
