<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Analytics</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style> body { font-family: 'Plus Jakarta Sans', sans-serif; } </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md bg-slate-900/80 backdrop-blur-xl border border-slate-800 rounded-3xl p-6 md:p-8 shadow-2xl space-y-6">
        
        <div class="text-center space-y-2">
            <div class="w-16 h-16 rounded-2xl bg-indigo-600/20 text-indigo-400 mx-auto flex items-center justify-center text-3xl mb-4">
                <i class="fa-solid fa-cloud-sun-rain"></i>
            </div>
            <h1 class="text-2xl font-bold tracking-wide">SkyPulse Weather</h1>
            <p class="text-xs text-slate-400">Search real-time weather & 5-day forecasts</p>
        </div>

        {% if error %}
        <div class="bg-red-500/10 border border-red-500/20 text-red-400 text-xs p-3 rounded-xl text-center font-medium">
            {{ error }}
        </div>
        {% endif %}

        <form action="/search" method="POST" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-2 uppercase tracking-wider">City or Location</label>
                <div class="relative">
                    <i class="fa-solid fa-location-dot absolute left-4 top-3.5 text-slate-500"></i>
                    <input type="text" name="city" placeholder="e.g., London, Tokyo, Mumbai" required
                        class="w-full bg-slate-950 border border-slate-800 rounded-xl pl-11 pr-4 py-3 text-slate-100 focus:outline-none focus:border-indigo-500 transition-all font-medium">
                </div>
            </div>

            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3.5 px-4 rounded-xl transition-all shadow-lg shadow-indigo-600/20 flex items-center justify-center gap-2">
                <span>Check Weather</span>
                <i class="fa-solid fa-arrow-right"></i>
            </button>
        </form>

    </div>

</body>
</html>
