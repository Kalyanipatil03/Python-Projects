<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Task Manager Dashboard{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans selection:bg-indigo-500 selection:text-white">

    <!-- Universal Modern Navigation Bar -->
    <nav class="bg-slate-800/80 backdrop-blur-md border-b border-slate-700/60 sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-6 py-3.5 flex justify-between items-center">
            <a href="/" class="flex items-center gap-3 group">
                <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-indigo-500 to-purple-500 text-white flex items-center justify-center font-extrabold shadow-lg shadow-indigo-500/20 group-hover:scale-105 transition">
                    TM
                </div>
                <span class="text-xl font-bold bg-gradient-to-r from-white via-slate-200 to-slate-400 bg-clip-text text-transparent">Task Engine</span>
            </a>
            
            <div class="flex items-center gap-4">
                {% if current_user.is_authenticated %}
                    <a href="/" class="text-sm font-medium text-slate-300 hover:text-white transition">Dashboard</a>
                    <div class="h-4 w-[1px] bg-slate-700"></div>
                    <span class="text-xs px-3 py-1 rounded-full bg-indigo-500/10 border border-indigo-500/20 text-indigo-300">
                        👤 {{ current_user.username }}
                    </span>
                    <a href="/logout" class="bg-rose-500/10 text-rose-400 border border-rose-500/20 hover:bg-rose-500 hover:text-white px-3.5 py-1.5 rounded-lg text-xs font-semibold transition">Logout</a>
                {% else %}
                    <a href="/login" class="text-slate-300 hover:text-white text-sm font-semibold transition">Login</a>
                    <a href="/register" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-1.5 rounded-lg text-sm font-semibold transition shadow-lg shadow-indigo-600/30">Register</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <main class="max-w-6xl mx-auto p-6">
        {% block content %}{% endblock %}
    </main>

</body>
</html>
