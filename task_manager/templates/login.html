{% extends 'base.html' %}

{% block content %}
<div class="max-w-md mx-auto my-12 bg-slate-800/90 border border-slate-700 p-8 rounded-2xl shadow-xl">
    <h2 class="text-2xl font-bold text-white mb-6 text-center">Login to Task Engine</h2>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="p-3 mb-4 text-xs text-rose-300 bg-rose-500/20 border border-rose-500/30 rounded-xl">{{ message }}</div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form action="/login" method="POST" class="space-y-4">
        <div>
            <label class="block text-xs font-medium text-slate-300">Email Address</label>
            <input type="email" name="email" required class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 mt-1 text-sm text-white focus:outline-none focus:border-indigo-500">
        </div>
        <div>
            <label class="block text-xs font-medium text-slate-300">Password</label>
            <input type="password" name="password" required class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 mt-1 text-sm text-white focus:outline-none focus:border-indigo-500">
        </div>
        <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3 rounded-xl transition">Sign In</button>
    </form>
    <p class="text-xs text-center text-slate-400 mt-4">Don't have an account? <a href="/register" class="text-indigo-400 underline">Register here</a></p>
</div>
{% endblock %}
