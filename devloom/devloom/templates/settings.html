{% extends "base.html" %}
{% block content %}
<div class="max-w-xl mx-auto space-y-6">
    <h1 class="text-2xl font-black text-white">Account Settings</h1>

    <form method="POST" class="bg-zinc-900/60 border border-zinc-800 p-6 rounded-xl space-y-4">
        <div class="space-y-1">
            <label class="text-xs font-semibold text-zinc-300">Display Name</label>
            <input type="text" name="display_name" value="{{ current_user.display_name }}" class="w-full bg-zinc-900 border border-zinc-800 text-xs text-white p-2.5 rounded-lg">
        </div>

        <div class="space-y-1">
            <label class="text-xs font-semibold text-zinc-300">Headline</label>
            <input type="text" name="headline" value="{{ current_user.headline or '' }}" class="w-full bg-zinc-900 border border-zinc-800 text-xs text-white p-2.5 rounded-lg">
        </div>

        <div class="space-y-1">
            <label class="text-xs font-semibold text-zinc-300">Bio</label>
            <textarea name="bio" rows="3" class="w-full bg-zinc-900 border border-zinc-800 text-xs text-white p-2.5 rounded-lg">{{ current_user.bio or '' }}</textarea>
        </div>

        <button type="submit" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold px-4 py-2 rounded-lg">Save Settings</button>
    </form>
</div>
{% endblock %}
