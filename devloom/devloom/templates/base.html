<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevLoom - Developer Knowledge Exchange</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="min-h-screen flex flex-col bg-zinc-950 text-zinc-100 font-sans antialiased">
    <!-- Navbar -->
    <nav class="border-b border-zinc-800 bg-zinc-950/80 backdrop-blur sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
            <a href="/" class="text-xl font-black text-emerald-400 tracking-wider flex items-center gap-2">
                <i class="fa-solid fa-code"></i> DevLoom
            </a>

            <form action="/explore" method="GET" class="hidden md:block w-72">
                <input type="text" name="q" placeholder="Search posts, tags..." class="w-full bg-zinc-900 border border-zinc-800 text-xs text-white px-3 py-1.5 rounded-lg focus:outline-none focus:border-emerald-500">
            </form>

            <div class="flex items-center gap-4 text-xs font-semibold">
                <a href="/explore" class="text-zinc-300 hover:text-white transition">Explore</a>
                {% if current_user.is_authenticated %}
                    <a href="/post/create" class="bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-1.5 rounded-lg transition">+ Create Post</a>
                    <a href="/library" class="text-zinc-300 hover:text-white transition">Library</a>
                    {% if current_user.is_admin %}
                    <a href="/admin/dashboard" class="text-amber-400 hover:text-amber-300 transition">Admin</a>
                    {% endif %}
                    <a href="/u/{{ current_user.username }}" class="text-zinc-300 hover:text-white font-mono">@{{ current_user.username }}</a>
                    <a href="/auth/logout" class="text-zinc-500 hover:text-zinc-300"><i class="fa-solid fa-right-from-bracket"></i></a>
                {% else %}
                    <a href="/auth/login" class="text-zinc-300 hover:text-white transition">Sign In</a>
                    <a href="/auth/register" class="bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-1.5 rounded-lg transition">Get Started</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-grow max-w-6xl w-full mx-auto px-4 py-8">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="border-t border-zinc-800/80 bg-zinc-950 py-6 text-center text-xs text-zinc-500">
        <p>&copy; DevLoom. Built for developers by developers.</p>
    </footer>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
