{% extends "base.html" %}
{% block content %}
<div class="max-w-md mx-auto py-12 space-y-6">
    <div class="text-center space-y-2">
        <h1 class="text-2xl font-black text-white">Welcome Back</h1>
        <p class="text-xs text-zinc-400">Sign in to your DevLoom account</p>
    </div>

    <form method="POST" class="bg-zinc-900/60 border border-zinc-800 p-6 rounded-xl space-y-4">
        <div class="space-y-1">
            <label class="text-xs font-semibold text-zinc-300">Email Address</label>
            <input type="email" name="email" required class="w-full bg-zinc-900 border border-zinc-800 text-xs text-white p-2.5 rounded-lg focus:outline-none focus:border-emerald-500">
        </div>

        <div class="space-y-1">
            <label class="text-xs font-semibold text-zinc-300">Password</label>
            <input type="password" name="password" required class="w-full bg-zinc-900 border border-zinc-800 text-xs text-white p-2.5 rounded-lg focus:outline-none focus:border-emerald-500">
        </div>

        <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold py-2.5 rounded-lg transition">Sign In</button>
    </form>
</div>
{% endblock %}
