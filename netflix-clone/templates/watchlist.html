<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Watchlist - NetFlix</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-zinc-950 text-white min-h-screen flex flex-col font-sans">
    <nav class="flex items-center justify-between px-8 py-4 bg-zinc-900 border-b border-zinc-800">
        <a href="/" class="text-2xl font-black text-red-600">NETFLIX</a>
        <a href="/" class="text-sm font-medium hover:text-red-500 transition">Back to Home</a>
    </nav>

    <main class="flex-grow p-8 max-w-7xl mx-auto w-full">
        <h1 class="text-3xl font-bold mb-6">My Watchlist</h1>

        {% if movies %}
        <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-6">
            {% for movie in movies %}
            <div class="bg-zinc-900 rounded-lg overflow-hidden border border-zinc-800 flex flex-col justify-between">
                <div class="aspect-[2/3] relative">
                    <img src="{{ movie.poster }}" class="w-full h-full object-cover">
                </div>
                <div class="p-4">
                    <h3 class="font-bold truncate">{{ movie.title }}</h3>
                    <p class="text-xs text-zinc-400 mb-4">{{ movie.genre }}</p>
                    <a href="/watch/{{ movie.id }}" class="block text-center py-2 bg-red-600 hover:bg-red-700 rounded text-xs font-bold transition">Play Now</a>
                </div>
            </div>
            {% endfor %}
        </div>
        {% else %}
        <div class="text-center py-20 text-zinc-500">
            <p>Your watchlist is currently empty.</p>
            <a href="/" class="mt-4 inline-block px-4 py-2 bg-zinc-800 text-white text-xs font-semibold rounded">Explore Catalog</a>
        </div>
        {% endif %}
    </main>
</body>
</html>
