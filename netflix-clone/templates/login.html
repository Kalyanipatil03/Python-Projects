<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NetFlix - Sign In</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-zinc-950 text-white min-h-screen flex items-center justify-center p-4">
    <div class="bg-zinc-900 border border-zinc-800 p-8 rounded-xl w-full max-w-md shadow-2xl">
        <h1 class="text-3xl font-bold text-red-600 text-center mb-6">NETFLIX</h1>
        <h2 class="text-xl font-semibold mb-6">Sign In</h2>

        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for message in messages %}
                    <div class="bg-red-500/10 border border-red-500/50 text-red-400 text-sm p-3 rounded mb-4">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form action="/login" method="POST" class="space-y-4">
            <div>
                <label class="block text-xs uppercase text-zinc-400 font-bold mb-1">Username or Email</label>
                <input type="text" name="identifier" required class="w-full bg-zinc-800 border border-zinc-700 rounded p-2.5 text-sm focus:outline-none focus:border-red-600">
            </div>
            <div>
                <label class="block text-xs uppercase text-zinc-400 font-bold mb-1">Password</label>
                <input type="password" name="password" required class="w-full bg-zinc-800 border border-zinc-700 rounded p-2.5 text-sm focus:outline-none focus:border-red-600">
            </div>
            <button type="submit" class="w-full bg-red-600 hover:bg-red-700 font-semibold py-2.5 rounded transition mt-2">Sign In</button>
        </form>

        <p class="text-sm text-zinc-400 text-center mt-6">
            New to NetFlix? <a href="/register" class="text-white hover:underline">Sign up now</a>.
        </p>
    </div>
</body>
</html>
