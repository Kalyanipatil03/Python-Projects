<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Form - Form Builder</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style> body { font-family: 'Plus Jakarta Sans', sans-serif; } </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-4 md:p-8">

    <div class="max-w-3xl mx-auto space-y-6">
        
        <!-- Header -->
        <div class="flex items-center justify-between">
            <a href="/" class="text-xs font-semibold text-slate-400 hover:text-slate-200 transition-colors">
                <i class="fa-solid fa-arrow-left mr-1"></i> Back to Dashboard
            </a>
            <span class="text-xs uppercase font-bold text-indigo-400 tracking-wider">Form Studio</span>
        </div>

        <!-- Form Details Box -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-400 uppercase mb-2">Form Title</label>
                <input type="text" id="formTitle" placeholder="e.g., Customer Feedback Survey" 
                    class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-slate-100 focus:outline-none focus:border-indigo-500 font-semibold">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-400 uppercase mb-2">Description (Optional)</label>
                <textarea id="formDesc" rows="2" placeholder="Briefly describe what this form is for..." 
                    class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-slate-100 focus:outline-none focus:border-indigo-500 text-sm"></textarea>
            </div>
        </div>

        <!-- Questions Canvas -->
        <div class="space-y-4">
            <h2 class="text-sm font-bold uppercase tracking-wider text-slate-400">Questions Layout</h2>
            <div id="fieldsContainer" class="space-y-4">
                <!-- Dynamic Question Cards will be added here -->
            </div>
        </div>

        <!-- Action Bar -->
        <div class="flex flex-wrap gap-3 pt-4 border-t border-slate-800/80">
            <button onclick="addField('text')" class="bg-slate-900 hover:bg-slate-800 text-slate-300 font-semibold text-xs px-4 py-3 rounded-xl border border-slate-800 flex items-center gap-2">
                <i class="fa-solid fa-font text-indigo-400"></i> Add Text Field
            </button>
            <button onclick="addField('select')" class="bg-slate-900 hover:bg-slate-800 text-slate-300 font-semibold text-xs px-4 py-3 rounded-xl border border-slate-800 flex items-center gap-2">
                <i class="fa-solid fa-list text-cyan-400"></i> Add Dropdown
            </button>
            <button onclick="addField('checkbox')" class="bg-slate-900 hover:bg-slate-800 text-slate-300 font-semibold text-xs px-4 py-3 rounded-xl border border-slate-800 flex items-center gap-2">
                <i class="fa-solid fa-square-check text-emerald-400"></i> Add Checkbox
            </button>
            
            <button onclick="saveForm()" class="ml-auto bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-xs px-6 py-3 rounded-xl transition-all shadow-lg shadow-indigo-600/20 flex items-center gap-2">
                <i class="fa-solid fa-floppy-disk"></i> Save & Publish
            </button>
        </div>

    </div>

    <!-- JavaScript Form Builder Logic -->
    <script>
        let fields = [];

        function addField(type) {
            const fieldId = 'field_' + Math.random().toString(36).substr(2, 9);
            const field = {
                id: fieldId,
                type: type,
                label: '',
                required: false,
                options: type === 'select' || type === 'checkbox' ? ['Option 1', 'Option 2'] : []
            };
            fields.push(field);
            renderFields();
        }

        function removeField(id) {
            fields = fields.filter(f => f.id !== id);
            renderFields();
        }

        function updateFieldLabel(id, label) {
            const field = fields.find(f => f.id === id);
            if (field) field.label = label;
        }

        function updateOptions(id, rawOptions) {
            const field = fields.find(f => f.id === id);
            if (field) {
                field.options = rawOptions.split('\n').map(o => o.trim()).filter(o => o.length > 0);
            }
        }

        function renderFields() {
            const container = document.getElementById('fieldsContainer');
            if (fields.length === 0) {
                container.innerHTML = `<div class="bg-slate-900/40 border border-dashed border-slate-800 p-8 rounded-2xl text-center text-xs text-slate-500">
                    No questions added yet. Click one of the buttons below to add fields.
                </div>`;
                return;
            }

            container.innerHTML = fields.map((f, index) => `
                <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-3 relative group">
                    <div class="flex items-center justify-between gap-4">
                        <span class="text-xs font-bold text-indigo-400 uppercase">Q${index + 1} (${f.type})</span>
                        <button onclick="removeField('${f.id}')" class="text-slate-500 hover:text-red-400 text-xs transition-colors">
                            <i class="fa-solid fa-trash"></i> Delete
                        </button>
                    </div>

                    <input type="text" placeholder="Enter Question / Label" value="${f.label}" 
                        oninput="updateFieldLabel('${f.id}', this.value)"
                        class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-indigo-500">

                    ${f.type === 'select' || f.type === 'checkbox' ? `
                        <div>
                            <label class="block text-[10px] font-semibold text-slate-500 uppercase mb-1">Options (One per line)</label>
                            <textarea oninput="updateOptions('${f.id}', this.value)" rows="2" 
                                class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-300 focus:outline-none focus:border-indigo-500">${f.options.join('\n')}</textarea>
                        </div>
                    ` : ''}
                </div>
            `).join('');
        }

        async function saveForm() {
            const title = document.getElementById('formTitle').value.trim();
            const description = document.getElementById('formDesc').value.trim();

            if (!title) {
                alert('Please enter a form title.');
                return;
            }
            if (fields.length === 0) {
                alert('Please add at least one field to your form.');
                return;
            }

            const payload = { title, description, fields };

            try {
                const response = await fetch('/api/forms/create', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const result = await response.json();
                if (result.success) {
                    window.location.href = result.redirect_url;
                } else {
                    alert('Error: ' + result.error);
                }
            } catch (err) {
                alert('Failed to save the form. Please check connection.');
            }
        }

        // Initialize empty state
        renderFields();
    </script>
</body>
</html>
