<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python Currency Converter</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md bg-slate-900/80 backdrop-blur-xl border border-slate-800 rounded-3xl p-6 md:p-8 shadow-2xl space-y-6">
        
        <!-- App Header -->
        <div class="flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-indigo-600/20 text-indigo-400 flex items-center justify-center text-lg">
                    <i class="fa-solid fa-coins"></i>
                </div>
                <h1 class="text-xl font-bold tracking-wide">Python FX</h1>
            </div>
            <span class="text-xs bg-emerald-500/10 text-emerald-400 px-3 py-1 rounded-full font-semibold flex items-center gap-1.5 border border-emerald-500/20">
                <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> Live Rates
            </span>
        </div>

        <!-- Converter Form -->
        <form action="/convert" method="POST" class="space-y-5">
            
            <!-- Amount Input -->
            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-2 uppercase tracking-wider">Amount</label>
                <input type="number" name="amount" value="100" min="0" step="any" required
                    class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-lg font-semibold text-slate-100 focus:outline-none focus:border-indigo-500 transition-all">
            </div>

            <!-- Currency Selectors -->
            <div class="grid grid-cols-[1fr_auto_1fr] items-center gap-2">
                
                <!-- From Currency -->
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-2 uppercase tracking-wider">From</label>
                    <select id="fromCurrency" name="from_currency" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-3 font-semibold text-slate-100 focus:outline-none focus:border-indigo-500 cursor-pointer">
                        {% for code, name in currencies.items() %}
                            <option value="{{ code }}" {% if code == 'USD' %}selected{% endif %}>{{ code }} - {{ name }}</option>
                        {% endfor %}
                    </select>
                </div>

                <!-- Swap Button -->
                <button type="button" id="swapBtn" class="mt-6 w-10 h-10 bg-slate-800 hover:bg-indigo-600 border border-slate-700 text-slate-200 rounded-full flex items-center justify-center transition-all hover:rotate-180">
                    <i class="fa-solid fa-arrow-right-arrow-left"></i>
                </button>

                <!-- To Currency -->
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-2 uppercase tracking-wider">To</label>
                    <select id="toCurrency" name="to_currency" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-3 font-semibold text-slate-100 focus:outline-none focus:border-indigo-500 cursor-pointer">
                        {% for code, name in currencies.items() %}
                            <option value="{{ code }}" {% if code == 'INR' %}selected{% endif %}>{{ code }} - {{ name }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3.5 px-4 rounded-xl transition-all shadow-lg shadow-indigo-600/20 active:scale-[0.98] flex items-center justify-center gap-2 mt-2">
                <span>Convert Now</span>
                <i class="fa-solid fa-arrow-right"></i>
            </button>
        </form>

    </div>

    <!-- Swap Button Logic -->
    <script>
        const fromSelect = document.getElementById('fromCurrency');
        const toSelect = document.getElementById('toCurrency');
        const swapBtn = document.getElementById('swapBtn');

        swapBtn.addEventListener('click', () => {
            const temp = fromSelect.value;
            fromSelect.value = toSelect.value;
            toSelect.value = temp;
        });
    </script>
</body>
</html>
